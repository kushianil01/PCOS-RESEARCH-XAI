[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcos-screening-support"
version = "0.1.0"
description = "Reproducible, explainable, non-invasive PCOS label-concordance screening-support prototype (research use only)"
requires-python = ">=3.11"
dependencies = [
  "pandas", "numpy", "scikit-learn", "scipy", "openpyxl", "matplotlib", "seaborn",
  "shap", "statsmodels", "joblib", "pyyaml", "streamlit", "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
